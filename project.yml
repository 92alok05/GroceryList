name: GroceryList
options:
  bundleIdPrefix: com.aljoshi.grocerylist
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  GroceryList:
    type: application
    platform: iOS
    sources:
      - path: GroceryList
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aljoshi.grocerylist.GroceryList
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "Grocery List"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: GroceryList/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Grocery List"
